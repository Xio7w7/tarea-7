<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarea 7 - Inventario de tienda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Inventario de la tienda</h1>

    <section class="panel">
      <h2>Agregar producto</h2>
      <form id="formulario-producto" novalidate>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Teclado mecánico">
        </div>
        <div class="campo">
          <label for="categoria">Categoría</label>
          <input type="text" id="categoria" name="categoria" placeholder="Ej. electronica">
        </div>
        <div class="campo">
          <label for="cantidad">Cantidad</label>
          <input type="number" id="cantidad" name="cantidad" min="1" step="1" placeholder="Ej. 10">
        </div>
        <div class="campo">
          <label for="precio">Precio ($)</label>
          <input type="number" id="precio" name="precio" min="0" step="0.01" placeholder="Ej. 25.50">
        </div>
        <button type="submit" class="btn-agregar">Agregar producto</button>
      </form>
      <p id="mensaje-error" class="mensaje-error"></p>
    </section>

    <section class="panel">
      <h2>Resumen de los productos mostrados</h2>
      <div class="indicadores">
        <div class="indicador">
          <span class="etiqueta">Productos</span>
          <span id="total-productos" class="valor">0</span>
        </div>
        <div class="indicador">
          <span class="etiqueta">Unidades</span>
          <span id="total-unidades" class="valor">0</span>
        </div>
        <div class="indicador">
          <span class="etiqueta">Valor total</span>
          <span id="valor-total" class="valor">$0.00</span>
        </div>
        <div class="indicador">
          <span class="etiqueta">Agotados</span>
          <span id="total-agotados" class="valor">0</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="barra-filtro">
        <h2>Productos</h2>
        <div class="campo-filtro">
          <label for="filtro-categoria">Filtrar por categoría</label>
          <select id="filtro-categoria">
            <option value="todas">todas</option>
          </select>
        </div>
      </div>

      <table class="tabla-inventario">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-inventario"></tbody>
      </table>
      <p id="mensaje-vacio" class="mensaje-vacio oculto">No hay productos para mostrar.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
